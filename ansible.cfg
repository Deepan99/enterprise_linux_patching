# Enterprise Linux Patching - Ansible Configuration
[defaults]
# Inventory configuration
inventory = ./inventories/production/hosts.yml

# Roles path
roles_path = ./roles

# Execution settings
forks = 20
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 3600

# Output and logging
stdout_callback = yaml
bin_ansible_callbacks = True
retry_files_enabled = False
log_path = ./logs/ansible.log

# Callback plugins (use callbacks_enabled instead of deprecated callback_whitelist)
callbacks_enabled = ansible.posix.timer, ansible.posix.profile_tasks

# Privilege escalation (removed global become to fix localhost plays)
[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

# SSH connection optimization
[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=3
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
