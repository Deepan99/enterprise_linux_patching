---
# Service validation tasks

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Validate critical services are running
  ansible.builtin.assert:
    that:
      - ansible_facts.services[item].state == pre_validation_service_state
    fail_msg: "Critical service {{ item }} is not running (state: {{ ansible_facts.services[item].state }})"
    quiet: true
  loop: "{{ pre_validation_critical_services }}"
  ignore_errors: true
  register: service_validation_failed
  when: pre_validation_critical_services | length > 0

- name: Set service validation status
  ansible.builtin.set_fact:
    validation_results:
      timestamp: "{{ validation_results.timestamp }}"
      host: "{{ validation_results.host }}"
      cpu_usage: "{{ validation_results.cpu_usage }}"
      memory_usage: "{{ validation_results.memory_usage }}"
      disk_usage: "{{ validation_results.disk_usage }}"
      system_load: "{{ validation_results.system_load }}"
      services_ok: "{{ not service_validation_failed.failed | default(true) }}"
      filesystem_ok: "{{ validation_results.filesystem_ok }}"
      maintenance_window_ok: "{{ validation_results.maintenance_window_ok }}"
      backup_ok: "{{ validation_results.backup_ok }}"
      overall_status: "{{ validation_results.overall_status }}"
