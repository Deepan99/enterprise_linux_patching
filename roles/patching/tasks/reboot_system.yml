---
# System reboot tasks

- name: Reboot system if required
  ansible.builtin.reboot:
    reboot_timeout: "{{ patching_reboot_timeout }}"
    connect_timeout: 10
    pre_reboot_delay: 5
    post_reboot_delay: 30
    test_command: uptime
  register: reboot_result

- name: Update patching results with reboot status
  ansible.builtin.set_fact:
    patching_results:
      timestamp: "{{ patching_results.timestamp }}"
      host: "{{ patching_results.host }}"
      os_family: "{{ patching_results.os_family }}"
      strategy: "{{ patching_results.strategy }}"
      packages_updated: "{{ patching_results.packages_updated }}"
      kernel_updated: "{{ patching_results.kernel_updated }}"
      reboot_required: "{{ patching_results.reboot_required }}"
      reboot_performed: "{{ reboot_result.rebooted | default(false) }}"
      duration: "{{ patching_results.duration }}"
