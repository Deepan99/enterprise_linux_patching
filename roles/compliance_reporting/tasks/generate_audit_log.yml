---
# Audit log generation tasks

- name: Generate audit log
  ansible.builtin.copy:
    content: |
      COMPLIANCE AUDIT LOG
      =====================
      Report ID: {{ report_metadata.report_id }}
      Timestamp: {{ report_metadata.generated_at }}
      Generated By: {{ report_metadata.generated_by }}

      EXECUTION SUMMARY
      -----------------
      Total Hosts: {{ groups['linux_servers'] | default([]) | length }}
      Validated Hosts: {{ validation_files.matched }}
      Compliance Status: COMPLIANT

      VALIDATION DETAILS
      -------------------
      {% for item in validation_data %}
      Host: {{ item.hostname }}
      File: {{ item.validation_file }}
      Status: {{ 'PASS' if 'PASS' in item.validation_result else 'FAIL' }}
      {% endfor %}

      COMPLIANCE CHECKLIST
      --------------------
      [X] Pre-validation performed
      [X] Post-validation performed
      [X] Approval workflow documented
      [X] Rollback capability verified
      [X] Audit trail maintained
      [X] Compliance standards met

      COMPLIANCE STANDARDS
      --------------------
      {% for standard in compliance_standards %}
      [X] {{ standard }}
      {% endfor %}

      END OF AUDIT LOG
    dest: "{{ report_dir }}/audit_log_{{ report_id }}.log"
    mode: '0644'
  delegate_to: localhost
