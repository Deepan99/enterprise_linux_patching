---
# Display summary tasks for compliance reporting

- name: Display report locations
  ansible.builtin.debug:
    msg:
      - "================================================"
      - "   COMPLIANCE REPORTS GENERATED"
      - "================================================"
      - "Report ID: {{ report_metadata.report_id }}"
      - "Generated At: {{ report_metadata.generated_at }}"
      - "Generated By: {{ report_metadata.generated_by }}"
      - "JSON Report: {{ report_dir }}/compliance_report_{{ report_id }}.json"
      - "HTML Report: {{ report_dir }}/compliance_report_{{ report_id }}.html"
      - "Audit Log: {{ report_dir }}/audit_log_{{ report_id }}.log"
      - "================================================"
