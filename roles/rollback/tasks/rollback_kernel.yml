---
# Kernel rollback tasks

- name: Rollback kernel to previous version (RHEL-based)
  ansible.builtin.shell: |
    rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | tail -2 | head -1
  register: previous_kernel
  changed_when: false
  when: os_family == 'rhel'

- name: Install previous kernel (RHEL-based)
  ansible.builtin.yum:
    name: "kernel-{{ previous_kernel.stdout }}"
    state: present
    update_cache: yes
  when:
    - os_family == 'rhel'
    - previous_kernel.stdout != ""
  ignore_errors: true
  register: kernel_rollback_result

- name: Update rollback results with kernel status
  ansible.builtin.set_fact:
    rollback_results:
      timestamp: "{{ rollback_results.timestamp }}"
      host: "{{ rollback_results.host }}"
      method: "{{ rollback_results.method }}"
      packages_rolled_back: "{{ rollback_results.packages_rolled_back }}"
      kernel_rolled_back: "{{ kernel_rollback_result.changed | default(false) }}"
      backup_restored: "{{ rollback_results.backup_restored }}"
      reboot_performed: "{{ rollback_results.reboot_performed }}"
      duration: "{{ rollback_results.duration }}"
