---
# Pre-rollback service management tasks

- name: Stop services before rollback
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
  loop: "{{ rollback_services_to_stop }}"
  register: services_stopped
  ignore_errors: true

- name: Display stopped services
  ansible.builtin.debug:
    msg: "Stopped service for rollback: {{ item.item }}"
  loop: "{{ services_stopped.results }}"
  when: item.changed
