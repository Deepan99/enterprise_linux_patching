---
# Post-rollback service management tasks

- name: Start services after rollback
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
  loop: "{{ rollback_services_to_stop }}"
  register: services_started
  ignore_errors: true

- name: Display started services
  ansible.builtin.debug:
    msg: "Started service after rollback: {{ item.item }}"
  loop: "{{ services_started.results }}"
  when: item.changed
