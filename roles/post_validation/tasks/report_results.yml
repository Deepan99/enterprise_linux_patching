---
# Reporting tasks for post-validation

- name: Calculate overall validation status
  ansible.builtin.set_fact:
    post_validation_results:
      timestamp: "{{ post_validation_results.timestamp }}"
      host: "{{ post_validation_results.host }}"
      cpu_usage: "{{ post_validation_results.cpu_usage }}"
      memory_usage: "{{ post_validation_results.memory_usage }}"
      disk_usage: "{{ post_validation_results.disk_usage }}"
      system_load: "{{ post_validation_results.system_load }}"
      services_ok: "{{ post_validation_results.services_ok }}"
      connectivity_ok: "{{ post_validation_results.connectivity_ok }}"
      applications_ok: "{{ post_validation_results.applications_ok }}"
      logs_ok: "{{ post_validation_results.logs_ok }}"
      overall_status: >-
        {{ 'PASS' if validation_failure_count == 0 else 'FAIL' }}

- name: Save post-validation results to file
  ansible.builtin.copy:
    content: |
      Post-Validation Report
      ======================
      Host: {{ post_validation_results.host }}
      Timestamp: {{ post_validation_results.timestamp }}
      CPU Usage: {{ post_validation_results.cpu_usage }}%
      Memory Usage: {{ post_validation_results.memory_usage }}%
      System Load: {{ post_validation_results.system_load }}
      High Disk Usage: {{ post_validation_results.disk_usage }}
      Services OK: {{ post_validation_results.services_ok }}
      Resources OK: {{ not post_resource_validation_failed | default(true) }}
      Port Connectivity: {{ connectivity_failures | default(0) }} failures
      App Health: {{ application_failures | default(0) }} failures
      Log Errors: {{ log_error_count | default(0) }}
      Validation Failures: {{ validation_failure_count }}
      Overall Status: {{ post_validation_results.overall_status }}
    dest: "{{ validation_results_dir | default('/tmp/patching_validation') }}/{{ inventory_hostname }}_post_validation.txt"
  delegate_to: localhost
