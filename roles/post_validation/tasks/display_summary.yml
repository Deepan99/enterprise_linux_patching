---
# Display summary tasks for post-validation

- name: Display post-validation summary
  ansible.builtin.debug:
    msg:
      - "================================================"
      - "   POST-VALIDATION SUMMARY"
      - "================================================"
      - "Host: {{ post_validation_results.host }}"
      - "Timestamp: {{ post_validation_results.timestamp }}"
      - "CPU: {{ post_validation_results.cpu_usage }}%"
      - "Memory: {{ post_validation_results.memory_usage }}%"
      - "Load: {{ post_validation_results.system_load }}"
      - "Services: {{ 'OK' if post_validation_results.services_ok else 'FAILED' }}"
      - "Connectivity: {{ 'OK' if post_validation_results.connectivity_ok else 'FAILED' }}"
      - "Applications: {{ 'OK' if post_validation_results.applications_ok else 'FAILED' }}"
      - "Logs: {{ 'OK' if post_validation_results.logs_ok else 'FAILED' }}"
      - "Failures: {{ validation_failure_count }}"
      - "Status: {{ post_validation_results.overall_status }}"
      - "================================================"
