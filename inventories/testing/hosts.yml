---
# Testing Inventory - Enterprise Linux Patching
# Use this inventory for development and testing of the patching framework

all:
  children:
    linux_servers:
      children:
        test_rhel:
          hosts:
            test-rhel-01:
              ansible_host: 192.168.100.10
              ansible_user: testuser
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: test
              criticality: low
              patching_strategy: full
              maintenance_window:
                start: "00:00"
                end: "23:59"
        test_debian:
          hosts:
            test-ubuntu-01:
              ansible_host: 192.168.100.20
              ansible_user: testuser
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: test
              criticality: low
              patching_strategy: full
              maintenance_window:
                start: "00:00"
                end: "23:59"
