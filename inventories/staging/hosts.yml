---
# Staging Inventory - Enterprise Linux Patching
# Use this environment for testing patches before production

all:
  children:
    linux_servers:
      children:
        rhel_based:
          hosts:
            rhel-staging-01:
              ansible_host: 192.168.2.10
              ansible_user: admin
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: application
              criticality: medium
              patching_strategy: full
              maintenance_window:
                start: "00:00"
                end: "23:59"
              critical_services:
                - httpd
        debian_based:
          hosts:
            ubuntu-staging-01:
              ansible_host: 192.168.2.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: web
              criticality: low
              patching_strategy: full
              maintenance_window:
                start: "00:00"
                end: "23:59"
              critical_services:
                - nginx
