---
# Production Inventory - Enterprise Linux Patching
# This inventory supports mixed Linux distributions

all:
  children:
    linux_servers:
      children:
        rhel_based:
          hosts:
            rhel-server-01:
              ansible_host: 192.168.1.10
              ansible_user: admin
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: application
              criticality: high
              patching_strategy: security
              maintenance_window:
                start: "02:00"
                end: "06:00"
              critical_services:
                - httpd
                - postgresql
            rhel-server-02:
              ansible_host: 192.168.1.11
              ansible_user: admin
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: database
              criticality: critical
              patching_strategy: kernel
              maintenance_window:
                start: "03:00"
                end: "07:00"
              critical_services:
                - postgresql
                - mongod
        debian_based:
          hosts:
            ubuntu-server-01:
              ansible_host: 192.168.1.20
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: web
              criticality: high
              patching_strategy: security
              maintenance_window:
                start: "02:00"
                end: "06:00"
              critical_services:
                - nginx
                - mysql
            ubuntu-server-02:
              ansible_host: 192.168.1.21
              ansible_user: ubuntu
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              server_type: application
              criticality: medium
              patching_strategy: full
              maintenance_window:
                start: "04:00"
                end: "08:00"
              critical_services:
                - apache2
    high_criticality:
      children:
        rhel_based:
          vars:
            patching_reboot_required: true
            patching_enable_rollback: true
            pre_validation_require_backup: true
    medium_criticality:
      children:
        debian_based:
          vars:
            patching_reboot_required: false
            patching_enable_rollback: true
            pre_validation_require_backup: false
